spring.application.name=patas-do-pico

# Banco (no Render, vêm das variáveis de ambiente)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/petshop}
spring.datasource.username=${DATABASE_USER:petshop}
spring.datasource.password=${DATABASE_PASSWORD:petshop}
spring.datasource.hikari.maximum-pool-size=5

# O esquema do banco é criado pelo Flyway (pasta db/migration); o Hibernate só confere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Segredo do token (no Render, defina JWT_SEGREDO com 32+ caracteres aleatórios)
app.jwt.segredo=${JWT_SEGREDO:segredo-apenas-para-desenvolvimento-local-troque}
app.jwt.horas-validade=12
# Endereço da tela (frontend) que pode chamar a API
app.cors.origens=${FRONTEND_URL:http://localhost:5173}
# true = recria os dados fictícios a cada inicialização (demo pública)
app.demo.reset=${DEMO_RESET:false}

server.port=${PORT:8080}
server.error.include-message=never
springdoc.swagger-ui.path=/swagger-ui.html
